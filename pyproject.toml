[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cycling-safety-ml"
version = "0.1.0"
description = "Recording-disjoint evaluation and reproducible inference for cycling IMU events"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Juan Andrés Vallejo Rozo"}]
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "scipy==1.15.3",
  "scikit-learn==1.7.2", "matplotlib==3.10.7",
  "fastapi==0.115.12", "uvicorn==0.34.3"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1"]
cnn = ["torch==2.8.0"]

[project.scripts]
cycling-ml = "cycling_safety.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
